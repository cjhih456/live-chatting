name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests
        run: pnpm test:integration
      # - name: Install Playwright browsers
      #   run: pnpm exec playwright install --with-deps chromium
      # - name: Playwright e2e
      #   run: pnpm e2e:web
      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_API_ORIGIN: 

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull Vercel environment
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'preview' }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cleanup() { rm -f .vercel/project-response.json .vercel/env-response.json; }
          trap cleanup EXIT
          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -o .vercel/project-response.json
          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v3/env/pull/${VERCEL_PROJECT_ID}/${VERCEL_TARGET}?teamId=${VERCEL_ORG_ID}" \
            -o .vercel/env-response.json
          python3 - <<'PY'
          import json
          import os

          with open(".vercel/project-response.json", encoding="utf-8") as handle:
              project = json.load(handle)
          with open(".vercel/env-response.json", encoding="utf-8") as handle:
              raw_env = handle.read()
          try:
              parsed = json.loads(raw_env)
          except json.JSONDecodeError:
              parsed = None
          if isinstance(parsed, dict) and isinstance(parsed.get("env"), str):
              env_text = parsed["env"]
          elif parsed is None:
              env_text = raw_env
          else:
              raise SystemExit("Unexpected Vercel env pull response")
          if env_text and not env_text.endswith("\n"):
              env_text += "\n"

          link = {
              "projectId": project["id"],
              "orgId": os.environ["VERCEL_ORG_ID"],
              "projectName": project["name"],
              "settings": {
                  "createdAt": project.get("createdAt"),
                  "framework": project.get("framework"),
                  "devCommand": project.get("devCommand"),
                  "installCommand": project.get("installCommand"),
                  "buildCommand": project.get("buildCommand"),
                  "outputDirectory": project.get("outputDirectory"),
                  "rootDirectory": project.get("rootDirectory"),
                  "directoryListing": project.get("directoryListing"),
                  "nodeVersion": project.get("nodeVersion"),
              },
          }
          target = os.environ["VERCEL_TARGET"]
          with open(".vercel/project.json", "w", encoding="utf-8") as handle:
              json.dump(link, handle, indent=2)
              handle.write("\n")
          with open(f".vercel/.env.{target}.local", "w", encoding="utf-8") as handle:
              handle.write(env_text)
          print(f"Wrote .vercel/project.json and .vercel/.env.{target}.local")
          PY
      - name: Build for Vercel
        working-directory: apps/web
        env:
          IS_PRODUCTION: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'true' || 'false' }}
          NEXT_PUBLIC_DATA_SOURCE: ${{ secrets.NEXT_PUBLIC_DATA_SOURCE }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_DATA_SOURCE: ${{ secrets.EXPO_PUBLIC_DATA_SOURCE }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            ENV_FILE=".vercel/.env.production.local"
            touch "$ENV_FILE"
            for key in \
              NEXT_PUBLIC_DATA_SOURCE \
              NEXT_PUBLIC_SUPABASE_ANON_KEY \
              NEXT_PUBLIC_SUPABASE_URL \
              EXPO_PUBLIC_DATA_SOURCE \
              EXPO_PUBLIC_SUPABASE_ANON_KEY \
              EXPO_PUBLIC_SUPABASE_URL
            do
              value="${!key}"
              if [ -n "$value" ]; then
                grep -v "^${key}=" "$ENV_FILE" > "${ENV_FILE}.tmp" || true
                mv "${ENV_FILE}.tmp" "$ENV_FILE"
                printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
              fi
            done
          fi
          vercel build ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: apps/web
        run: vercel deploy --prebuilt ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}


